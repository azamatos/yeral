      { id: 'ojak', cat: 'food', name: 'Ojak', img: '../../assets/photos/nick-hillier-xBXF9pr6LQo-unsplash.jpg', alt: 'Ojak restorany', rating: '4,7', count: '(88)', meta: 'Restoran · Garaşsyzlyk şaýoly 15 · 2,8 km', line: 'Stol · 2 adam', slots: ['19:00', '19:30', '20:45'], more: '+4', x: 64, y: 70 },

    ];
    // D2 · party size: only with the Restoran we kafe (table type) category; default 2; options 1–7 and 8+ (8+ = times for 8)
    const partyDefs = ['1', '2', '3', '4', '5', '6', '7', '8+'];
    const showParty = s.cat === 'food';
    const pn = showParty ? s.party : '2';
    const pIdx = partyDefs.indexOf(pn);
    const bucket = pIdx <= 1 ? 0 : (pIdx <= 3 ? 1 : (pIdx <= 5 ? 2 : 3));
    const tableTimes = {
      bag: [
        { slots: ['13:00', '13:30', '18:00'], more: '+3' },
        { slots: ['13:30', '18:00', '19:30'], more: '+2' },
        { slots: ['18:00', '20:00'], more: '+1' },
        { slots: ['19:00', '20:00'], more: '' }
      ],
      ojak: [
        { slots: ['19:00', '19:30', '20:45'], more: '+4' },
        { slots: ['19:30', '20:45', '21:00'], more: '+2' },
        { slots: ['20:45', '21:15'], more: '' },
        { slots: ['21:15'], more: '' }
      ]
    };
    // Bag kafe: terrace for up to 4, VIP otag from 6 (CLIENT-SPEC 4.5)
    const bagNote = pIdx <= 3 ? ' · terrasa bar' : (pIdx >= 5 ? ' · VIP otag bar' : '');
    const withParty = (r) => {
      const t = tableTimes[r.id];
      if (!t) return r;
      const b = t[bucket];
      return { ...r, line: 'Stol · ' + pn + ' adam' + (r.id === 'bag' ? bagNote : ''), slots: b.slots, more: b.more };
    };
    const partyOpts = partyDefs.map((t) => ({
      t, on: t === pn ? 'true' : 'false',
      cls: t === pn ? 'pc on' : 'pc',
      aria: t + ' adam',
      pick: () => this.setState({ party: t, partyOpen: false, hot: null })
    }));
    const catDefs = [['all', 'Ählisi'], ['beauty', 'Gözellik'], ['health', 'Saglyk'], ['food', 'Restoran we kafe'], ['sport', 'Sport'], ['edu', 'Okuw'], ['auto', 'Awtoulag'], ['pets', 'Öý haýwanlary']];
    const cats = catDefs.map(([id, t]) => ({ t, on: s.cat === id, cls: s.cat === id ? 'chip on' : 'chip', pick: () => this.setState({ cat: id, hot: null, partyOpen: false }) }));
    const dayDefs = [['today', 'Şu gün'], ['tomorrow', 'Ertir'], ['week', 'Şu hepde']];
    const days = dayDefs.map(([id, t]) => ({ t, cls: s.day === id ? 'sgb on' : 'sgb', pick: () => this.setState({ day: id }) }));
    const km = (r) => parseFloat(r.meta.split('·').pop().replace(',', '.'));
    const list = (s.cat === 'all' ? all : all.filter((r) => r.cat === s.cat)).map(withParty).sort((a, b) => km(a) - km(b));
    const rows = list.map((r) => ({ ...r, href: r.href || '#', hasTag: !!r.tag, cls: s.hot === r.id ? 'rr hot' : 'rr', enter: () => this.setState({ hot: r.id }) }));
    const pins = list.map((r) => ({ x: r.x, y: r.y, t: r.slots[0], cls: s.hot === r.id ? 'pin hot' : 'pin' }));
    const catName = (catDefs.find(([id]) => id === s.cat) || catDefs[0])[1];
    const dayLabel = (dayDefs.find(([id]) => id === s.day) || dayDefs[0])[1];
    return {
      fontStack: "'" + f + "', ui-sans-serif, -apple-system, 'Segoe UI', sans-serif",
      cats, days, rows, pins,
      showParty, partyOpts,
      partyN: pn,
      partyOpen: showParty && s.partyOpen,
      partyAria: 'Adam sany: ' + pn + '. Üýtgetmek',
      toggleParty: () => this.setState({ partyOpen: !this.state.partyOpen }),
      closeParty: () => this.setState({ partyOpen: false }),
      leave: () => this.setState({ hot: null }),
      empty: rows.length === 0,
      whatLabel: s.cat === 'all' ? 'Ähli hyzmatlar' : catName,
      dayLabel,
      title: s.cat === 'all' ? 'Golaýyňyzdaky ýerler' : catName + ' — golaýyňyzda',
      countLabel: rows.length + ' ýer · ' + dayLabel.toLowerCase() + ' boş wagty bar'
    };
  }
}
