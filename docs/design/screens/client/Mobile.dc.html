<style>
body{margin:0;background:#f4f4f6}
*{box-sizing:border-box}
a{color:#4429d6;text-decoration:none}a:hover{color:#3520a6}
.lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#6e6e78}
.cap{font-size:13px;line-height:18px;color:#5a5a64}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-family:inherit;font-size:15px;line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.b-sm{height:36px;padding:0 14px;border-radius:10px;font-size:14px}
.b-lg{height:52px;padding:0 24px;border-radius:14px;font-size:16px}
.b-pri{background:linear-gradient(180deg,#8265ff 0%,#5a3ff0 100%);color:#ffffff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 6px rgba(68,41,214,.3)}
.b-pri:hover{background:linear-gradient(180deg,#7459fb 0%,#4a30d8 100%);color:#ffffff}
.b-sec{background:#ffffff;border-color:#d8d8de;color:#101014}
.b-sec:hover{background:#f6f6f8;border-color:#b0b0b8;color:#101014}
.b-gho{background:transparent;color:#101014}
.b-gho:hover{background:#f4f4f6;color:#101014}
.b-tin{background:#efecfe;border-color:#d5cbfb;color:#4429d6}
.b-tin:hover{background:#ded7fd;color:#4429d6}
.b-dtx{background:transparent;color:#a3251b}
.b-dtx:hover{background:#fee4e2;color:#a3251b}
.b-ink{background:#101014;color:#ffffff}
.b-ink:hover{background:#2a2a32;color:#ffffff}
.b:focus-visible{outline:none;box-shadow:0 0 0 2px #ffffff,0 0 0 4px #7a5ff4}
.b-ico{width:44px;padding:0;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid #d8d8de;background:#ffffff;font-family:inherit;font-size:14px;font-weight:500;color:#101014;cursor:pointer;white-space:nowrap;flex:none}
.chip:hover{background:#f6f6f8}
.chip.on{background:#efecfe;border-color:#d5cbfb;color:#4429d6}
.tab{flex:none;height:44px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:none;font-family:inherit;font-size:15px;font-weight:500;color:#5a5a64;cursor:pointer;white-space:nowrap}
.tab:hover{color:#101014}
.tab.on{color:#101014;font-weight:600;border-bottom-color:#5a3ff0}
.slot{display:inline-flex;align-items:center;justify-content:center;height:40px;min-width:64px;padding:0 10px;border-radius:10px;border:1px solid #d8d8de;background:#ffffff;font-family:inherit;font-size:14px;font-weight:600;color:#101014;cursor:pointer;flex:none}
.slot:hover{border-color:#5a3ff0;color:#4429d6}
.slot.on{background:#5a3ff0;border-color:#5a3ff0;color:#ffffff}
.slot:disabled{background:#f6f6f8;border-color:#f0f0f3;color:#6e6e78;text-decoration:line-through;cursor:not-allowed}
.slot-s{height:36px;min-width:52px;padding:0 8px;font-size:13px}
.slot-g{width:100%;min-width:0;height:44px}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;align-self:flex-start}
.dot{width:6px;height:6px;border-radius:999px;flex:none}
.st-p{background:#fef6e7;border:1px solid #f2ddb0;color:#93500a}
.st-c{background:#efecfe;border:1px solid #d5cbfb;color:#4429d6}
.st-d{background:#e7f8ee;border:1px solid #bfe6d1;color:#066a41}

.pin{position:absolute;transform:translate(-50%,-100%);display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:999px;background:#ffffff;border:1px solid #d8d8de;font-size:13px;font-weight:700;color:#101014;white-space:nowrap;box-shadow:0 2px 6px rgba(16,16,20,.12)}
.pin.hot{background:#101014;border-color:#101014;color:#ffffff;z-index:2;box-shadow:0 8px 24px rgba(16,16,20,.24)}
.hit{position:relative}
.hit::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.hs{display:flex;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.fig{margin:0;display:flex;flex-direction:column;gap:16px}
.ph{position:relative;width:390px;height:844px;flex:none;background:#ffffff;border:1px solid #d8d8de;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;color:#101014}
.fcap{display:flex;flex-direction:column;gap:4px;width:390px;min-height:94px}
.ft{font-size:13px;line-height:18px;font-weight:600;color:#101014}
.ib{width:44px;height:44px;flex:none;border-radius:999px;border:0;background:#ffffff;color:#101014;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(16,16,20,.16)}
.ib:hover{background:#f6f6f8;color:#101014}
.ib:focus-visible{outline:none;box-shadow:0 0 0 2px #ffffff,0 0 0 4px #7a5ff4}
.qp{display:flex;align-items:center;gap:10px;height:48px;flex:1;min-width:0;padding:0 16px;border:1px solid #d8d8de;border-radius:999px;background:#ffffff;font-family:inherit;text-align:left;color:#101014;cursor:pointer}
.qp:focus-visible{outline:none;box-shadow:0 0 0 2px #ffffff,0 0 0 4px #7a5ff4}
.qp1{font-size:14px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qp2{font-size:12px;line-height:16px;color:#5a5a64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagp{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#ffffff;color:#101014;font-size:12px;font-weight:600}
.mos{margin:0;position:relative;border-radius:14px;overflow:hidden}
.mos img{width:100%;height:100%;object-fit:cover;display:block}
.vc{display:flex;flex-direction:column;gap:10px;width:260px;flex:none;color:#101014}
.vc:hover{color:#101014}
.rt{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:22px;font-weight:600;color:#101014;flex:none}
.mr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #e6e6ea;color:#101014}
.mr:hover{color:#101014}
.mcard{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;width:300px;flex:none;padding:12px;border-radius:16px;background:#ffffff;color:#101014;box-shadow:0 8px 24px rgba(16,16,20,.16)}
.mcard:hover{color:#101014}
.mcard.on{box-shadow:0 0 0 2px #101014,0 8px 24px rgba(16,16,20,.16)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:56px;height:72px;flex:none;padding:0;border-radius:12px;border:1px solid #e6e6ea;background:#ffffff;font-family:inherit;color:#101014;cursor:pointer}
.dcell:hover{border-color:#b0b0b8}
.dw{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#6e6e78}
.dn{font-size:17px;line-height:22px;font-weight:600}
.dm{font-size:11px;line-height:14px;color:#6e6e78}
.dcell.today{border-color:#101014}
.dcell.on{background:#5a3ff0;border-color:#5a3ff0;color:#ffffff}
.dcell.on .dw,.dcell.on .dm{color:#ffffff}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e6e6ea}
.tgl{min-width:116px}
.brow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid #e6e6ea;color:#101014}
.brow:hover{color:#101014}
.srow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:48px;border-bottom:1px solid #e6e6ea;font-size:15px;line-height:20px;color:#101014}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #e6e6ea;background:#ffffff}
</style>

<div style="width: 1442px; min-height: 2280px; padding: 64px; background: #f4f4f6; color: #101014; font-family: 'Onest', ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 48px">
