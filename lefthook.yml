# Git hooks (installed by `pnpm install` through the `prepare` script).
# Fast checks only; lint, types and tests run in CI and through `pnpm check`.
pre-commit:
  commands:
    format:
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc,css,yml,yaml}'
      exclude:
        - 'apps/legacy/**'
        - 'docs/design/**'
        - 'pnpm-lock.yaml'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
