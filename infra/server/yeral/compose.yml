# Ýeral on the owner's server (ADR 0023): Postgres and the api, behind the shared Caddy (../edge).
# Lives at /srv/yeral with its .env (secrets, never in git: .env.example). Deploy: infra/server/README.md.
name: yeral
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: yeral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: yeral
    # tuned for a share of an 8 GB server that also runs other projects
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yeral']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1536m

  # migrations and the category catalogue (YERAL_ENV=production never seeds the demo), then exits
  migrate:
    image: ${YERAL_API_IMAGE:?set by deploy.sh}
    command: ['node', 'dist/cli.js', 'setup']
    environment: &api-env
      DATABASE_URL: postgres://yeral:${POSTGRES_PASSWORD}@postgres:5432/yeral
      YERAL_ENV: production
      YERAL_DOMAIN: yeral.app
      PORT: '3004'
      # Caddy sets X-Forwarded-For to the caller's address and drops what the caller sent
      TRUSTED_IP_HEADER: x-forwarded-for
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  api:
    image: ${YERAL_API_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
      edge:
        aliases: [yeral-api]
    mem_limit: 512m

networks:
  edge:
    external: true

volumes:
  pgdata:
