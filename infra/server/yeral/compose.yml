# Ýeral on the owner's server (ADR 0023): Postgres, the api and the business app, behind the shared Caddy (../edge).
# Lives at /srv/yeral with its .env (secrets, never in git: .env.example). Deploy: infra/server/README.md.
name: yeral
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: yeral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: yeral
    # tuned for a share of an 8 GB server that also runs other projects
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yeral']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1536m

  # migrations and the category catalogue (YERAL_ENV=production never seeds the demo), then exits
  migrate:
    image: ${YERAL_API_IMAGE:?set by deploy.sh}
    command: ['node', 'dist/cli.js', 'setup']
    environment: &api-env
      DATABASE_URL: postgres://yeral:${POSTGRES_PASSWORD}@postgres:5432/yeral
      YERAL_ENV: production
      YERAL_DOMAIN: yeral.app
      PORT: '3004'
      # Caddy sets X-Forwarded-For to the caller's address and drops what the caller sent
      TRUSTED_IP_HEADER: x-forwarded-for
      # the photos people upload (book F-101), on the `media` volume
      MEDIA_DIR: /data/media
      # the first launch's sign-in code on the screen (book Q-036): anyone who types a number signs in as it. On since
      # 25.10.2026 (the owner), so the business app can be tried live before the launch: test data only (operations.md)
      SIGN_IN_CODE_ON_SCREEN: 'true'
      # the first launch's example businesses (book Q-004): `setup` adds them, marked "Example" and confirming at once;
      # on with the code on the screen when the first launch opens (operations.md)
      EXAMPLE_BUSINESSES: 'false'
      # the phone every example shows and "Call" reaches: the market's support line (MARKET.support.phone) unless set
      # EXAMPLE_PHONE: '+993…'
      # the business app's demo workspace (book F-242): the jobs make it and make it again every night at 04:00; on
      # when the first launch opens (operations.md)
      DEMO_WORKSPACE: 'false'
      # the kinds of booking open (book Q-030): appointments until tables and classes ship
      BOOKING_TYPES: appointment
      # the Ýeral team's authenticator secrets are sealed under it (ADR 0026); deploy.sh makes it once
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?set by deploy.sh}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  api:
    image: ${YERAL_API_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    environment: *api-env
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
      edge:
        aliases: [yeral-api]
    mem_limit: 512m

  # the business app's static build (business.Dockerfile, its own Caddy); the shared Caddy adds TLS and proxies to it
  business:
    image: ${YERAL_BUSINESS_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    networks:
      edge:
        aliases: [yeral-business]
    mem_limit: 128m

networks:
  edge:
    external: true

volumes:
  pgdata:
  media:
