# Production-like stack on this machine: `pnpm docker:up` → http://yeral.localhost, http://business.yeral.localhost,
# http://api.yeral.localhost/docs (operations.md).
# The same api image runs on the own server (infra/server/yeral), behind the same kind of Caddy with TLS and real hosts.
name: yeral
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: yeral
      POSTGRES_PASSWORD: yeral
      POSTGRES_DB: yeral
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yeral']
      interval: 2s
      timeout: 3s
      retries: 30

  # creates the schema and the demo data once, then exits
  migrate:
    image: yeral-api:local
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        GITHUB_SHA: ${GITHUB_SHA:-local}
    command: ['node', 'dist/cli.js', 'setup']
    environment: &api-env
      DATABASE_URL: postgres://yeral:yeral@postgres:5432/yeral
      YERAL_ENV: docker
      YERAL_DOMAIN: yeral.app
      PORT: '3004'
      DEMO_MEDIA_DIR: /app/media-demo
      # client IPs for rate limits come from Caddy (Caddyfile)
      TRUSTED_IP_HEADER: x-forwarded-for
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: yeral-api:local
    environment: *api-env
    volumes:
      # the design's demo photos (free Unsplash licence, docs/design/assets/photos/CREDITS.md)
      - ../../docs/design/assets/photos:/app/media-demo:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # the business app: its static build, served by its own small Caddy (business.Dockerfile)
  business:
    image: yeral-business:local
    build:
      context: ../..
      dockerfile: infra/docker/business.Dockerfile
      args:
        GITHUB_SHA: ${GITHUB_SHA:-local}
        YERAL_ENV: docker

  # the client site: its server-side renderer on Node (client.Dockerfile); it asks the api inside the stack
  client:
    image: yeral-client:local
    build:
      context: ../..
      dockerfile: infra/docker/client.Dockerfile
      args:
        GITHUB_SHA: ${GITHUB_SHA:-local}
        YERAL_ENV: docker
    environment:
      API_INTERNAL_URL: http://api:3004
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      business:
        condition: service_healthy
      client:
        condition: service_healthy

volumes:
  pgdata:
