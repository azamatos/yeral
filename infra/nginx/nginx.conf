# The front door (ADR 0007): one server block per host in conf.d/. Locally plain http on *.yeral.localhost; on the own
# server TLS (Let's Encrypt) is added per host and Cloudflare stays DNS only.
user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 10m;

  log_format json escape=json '{"time":"$time_iso8601","host":"$host","method":"$request_method","uri":"$request_uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"ip":"$remote_addr"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml text/plain;

  # security headers for every host
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  include /etc/nginx/conf.d/*.conf;
}
