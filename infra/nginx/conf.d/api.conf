# api.<domain> → the api container. Client, business and cms hosts join with their apps (M3, M5, M6).
upstream api {
  server api:3004;
  keepalive 16;
}

server {
  listen 80;
  server_name api.yeral.localhost;

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # the caller's IP for rate limits: the api trusts the last X-Forwarded-For entry (TRUSTED_IP_HEADER in compose.yml),
    # which is the one set here; a client-sent CF-Connecting-IP is dropped so it can't pose as another caller
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# unknown hosts get nothing
server {
  listen 80 default_server;
  return 444;
}
