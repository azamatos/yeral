name: Release

# On every push to main, Changesets either opens/updates the «chore: version packages» PR,
# or — when that PR has just been merged — tags the new versions, creates GitHub Releases
# and deploys the apps whose version changed to production.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  LEFTHOOK: 0

jobs:
  release:
    name: Version PR or tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm tag-release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true

  deploy-legacy:
    name: Deploy legacy
    needs: release
    if: needs.release.outputs.published == 'true' && contains(fromJSON(needs.release.outputs.packages).*.name, '@yeral/legacy')
    uses: ./.github/workflows/deploy.yml
    with:
      app: legacy
      environment: production
    secrets: inherit
