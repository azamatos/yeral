name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  LEFTHOOK: 0

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # API tests (apps/api) run against Postgres 18, like Neon and the own server
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yeral
          POSTGRES_PASSWORD: yeral
          POSTGRES_DB: yeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yeral" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://yeral:yeral@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # turbo --affected compares with the base branch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Chromium for story tests
        # cached by Playwright version; system libraries come from --with-deps
        id: pw
        run: echo "version=$(pnpm --filter @yeral/storybook exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter @yeral/storybook exec playwright install --with-deps chromium
      - name: Format
        run: pnpm format:check
      - name: Lint, FSD, types, tests, build
        # pull requests check only what they affect; main checks everything
        run: pnpm turbo run lint lint:fsd typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  docker:
    name: Docker stack
    # the own server's stack (ADR 0007): build the api image, start Postgres + api + nginx, ask for health through nginx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f infra/docker/compose.yml up -d --build --wait
      - name: Health through nginx
        run: |
          curl -fsS -H 'Host: api.yeral.localhost' http://localhost/v1/health
          curl -fsS -H 'Host: api.yeral.localhost' 'http://localhost/v1/search?lat=37.95&lng=58.383&limit=1' > /dev/null
      - name: Logs
        if: failure()
        run: docker compose -f infra/docker/compose.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  deploy-storybook:
    name: Deploy Storybook
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      app: storybook
      environment: production
    secrets: inherit

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
