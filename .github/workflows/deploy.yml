name: Deploy

# Reusable: ci.yml calls it for Storybook on every push to main; legacy is deployed by hand (Actions → Deploy). Releases
# are paused until the MVP works (ADR 0009, amended 2026-10-21); there is no staging (ADR 0020).
# Each app has a `deploy:<environment>` script: Storybook and legacy on Cloudflare. The api and the new apps deploy to
# the own server over SSH (book chapter 10, P2 step 7; by hand until then: infra/server/README.md).

on:
  workflow_call:
    inputs:
      app:
        description: Folder name under apps/
        type: string
        required: true
      environment:
        description: production (the only deployed environment)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        options: [legacy, storybook]
      environment:
        description: Environment
        type: choice
        options: [production]

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.app }} → ${{ inputs.environment }}
    # production only from main: a run started by hand on another branch does nothing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      APP: ${{ inputs.app }}
      DEPLOY_ENV: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TURBO_TELEMETRY_DISABLED: 1
      LEFTHOOK: 0
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so $APP was not deployed. See docs/memory-bank/operations.md → Secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: pnpm --filter "@yeral/$APP" run "deploy:$DEPLOY_ENV"
      - name: Smoke check
        if: steps.creds.outputs.ok == 'true'
        run: scripts/smoke.sh "$APP" "$DEPLOY_ENV" "$GITHUB_SHA"
