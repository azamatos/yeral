name: Task
description: A piece of work for a person or an agent (one PR)
labels: ['status:ready']
body:
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      options: [platform, client, business, cms, landing, design system]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, in user terms.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Apps, packages and slices this task may change. Anything else needs a comment first (ADR 0014).
      placeholder: |
        - apps/client/src/pages/salon
        - packages/ui (button only)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
        - [ ] tests / stories added
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, links, design screens
