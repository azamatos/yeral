name: Bug
description: Something works differently than it should
labels: ['type:bug', 'status:ready']
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Site and page, e.g. client.yeral.app/nozhnitsy
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, device, browser
