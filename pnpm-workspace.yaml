packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole monorepo: packages reference them as "catalog:".
# apps/legacy (the frozen Next.js app) keeps its own pinned versions.
catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  class-variance-authority: ^0.7.1
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  esbuild: ^0.28.2
  clsx: ^2.1.1
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  eslint: ^10.12.0
  eslint-plugin-react-hooks: ^7.1.1
  '@eslint/js': ^10.0.1
  '@fontsource-variable/onest': ^5.3.1
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  '@neon/config': ^1.9.1
  '@neon/env': ^1.6.1
  globals: ^17.13.0
  hono: ^4.13.13
  lefthook: ^2.2.2
  lucide-react: ^1.56.0
  pg: ^8.23.1
  playwright: ^1.64.0
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  radix-ui: ^1.8.1
  react: ^19.3.0
  react-dom: ^19.3.0
  '@scalar/hono-api-reference': ^0.12.12
  sonner: ^2.0.8
  storybook: ^10.6.2
  '@storybook/addon-a11y': ^10.6.2
  '@storybook/addon-docs': ^10.6.2
  '@storybook/addon-vitest': ^10.6.2
  '@storybook/react-vite': ^10.6.2
  tailwind-merge: ^3.7.0
  '@tanstack/react-query': ^5.104.2
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  tsx: ^4.23.15
  turbo: ^2.11.8
  use-intl: ^4.14.9
  '@turbo/gen': ^2.11.8
  '@types/node': ^24.0.0
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  typescript: ~6.0.3
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vitest: ^5.0.4
  '@vitest/browser-playwright': ^5.0.4
  wrangler: ^4.150.0
  zod: ^4.6.7

# Install scripts (pnpm 11+): nothing runs unless listed as true. These ship prebuilt binaries through
# optional dependencies, so their scripts aren't needed; listing them as false keeps installs quiet.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lefthook: false
  sharp: false
  unrs-resolver: false
  workerd: false

# Versions younger than pnpm's 1-day minimum release age that the lockfile already uses (written by pnpm).
minimumReleaseAgeExclude:
  - '@opennextjs/aws@4.1.10'
  - '@opennextjs/cloudflare@1.20.11'
  - '@radix-ui/react-accordion@1.3.1'
  - '@radix-ui/react-alert-dialog@1.2.1'
  - '@radix-ui/react-avatar@1.3.1'
